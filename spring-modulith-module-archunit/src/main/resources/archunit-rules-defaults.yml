dev:
  clutcher:
    modulith:
      archunit:
        rules:
          hexagonal:
            package:
              generated-class-annotations:
                - "javax.annotation.processing.Generated"
                - "jakarta.annotation.Generated"
                - "org.springframework.aot.generate.Generated"
          code-conventions:
            no-dto-in-class-names:
              enabled: true
            no-impl-postfix:
              enabled: true
            logger-field-naming:
              enabled: true
            spring-adapter-public-parameter-types:
              enabled: true
            mapper-annotated-with-generated:
              enabled: true
            public-method-parameter-type-naming:
              enabled: false
